<!doctype html>
<html><head><meta charset="utf-8"><title>Leaf icon concepts</title>
<style>
  body{margin:0;padding:32px 24px;background:#F3F5F1;font-family:-apple-system,Helvetica,sans-serif;color:#1B2A27;box-sizing:border-box}
  h1{margin:0 0 4px;font-size:24px;color:#145F58;text-align:center}
  p.sub{margin:0 0 24px;text-align:center;color:#5A6B67;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .card{background:#fff;border:1px solid #DDE3DF;border-radius:16px;padding:16px 12px;text-align:center}
  .card h2{margin:10px 0 2px;font-size:16px}
  .card p{margin:0;font-size:12px;color:#5A6B67;min-height:32px}
  .row{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:10px}
  svg{display:block}
  .big{width:150px;height:150px;border-radius:50%;overflow:hidden;margin:0 auto;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .sq{width:56px;height:56px;border-radius:16px;overflow:hidden}
  .ci{width:40px;height:40px;border-radius:50%;overflow:hidden}
  .mono{width:56px;height:56px;border-radius:16px;overflow:hidden}
  .dark{background:#1B2422;border-radius:12px;padding:6px}
</style></head><body style="max-width:1080px;margin:0 auto">
<h1>Cannsheet · leaf icon concepts</h1>
<p class="sub">Flat, soft shapes on a solid field, like Poop Schedule. Ledger Green. Big circle, then squircle, small circle, themed mono light/dark.</p>
<div class="grid" id="grid"></div>
<script>
const BG='#145F58', CREAM='#FBF4EA', TINT='#BFE0D2';
// Leaflet: lens pointing up from base (54,base) with given length and half-width.
const leaflet=(len,w,base=70,x=54)=>{const t=base-len;return `M${x},${t} C${x+w},${t+len*.3} ${x+w},${base-len*.35} ${x},${base} C${x-w},${base-len*.35} ${x-w},${t+len*.3} ${x},${t} Z`;};
const concepts=[
 {name:'A · Single leaf',desc:'One broad leaf, tilted, with a cut midrib.',
  fg:(c,t)=>`<g transform="rotate(32 54 56)"><path fill="${c}" d="${leaflet(58,22,84)}"/><path d="M54,34 L54,80" stroke="${BG}" stroke-width="3.2" stroke-linecap="round" class="cut"/></g>`},
 {name:'B · Three leaflets',desc:'Three soft blades from one stem; the Poop trio, as a leaf.',
  fg:(c,t)=>`<rect x="52" y="66" width="4" height="16" rx="2" fill="${t}"/>
   <path fill="${t}" transform="rotate(-52 54 68)" d="${leaflet(36,10,68)}"/>
   <path fill="${t}" transform="rotate(52 54 68)" d="${leaflet(36,10,68)}"/>
   <path fill="${c}" d="${leaflet(46,12,68)}"/>`},
 {name:'C · Fan leaf',desc:'Simplified seven-point cannabis leaf; most recognisable.',
  fg:(c,t)=>`<rect x="52.4" y="68" width="3.2" height="16" rx="1.6" fill="${t}"/>
   <path fill="${t}" transform="rotate(-100 54 70)" d="${leaflet(18,3.6,70)}"/>
   <path fill="${t}" transform="rotate(100 54 70)" d="${leaflet(18,3.6,70)}"/>
   <path fill="${t}" transform="rotate(-66 54 70)" d="${leaflet(30,5.2,70)}"/>
   <path fill="${t}" transform="rotate(66 54 70)" d="${leaflet(30,5.2,70)}"/>
   <path fill="${c}" transform="rotate(-32 54 70)" d="${leaflet(40,6.4,70)}"/>
   <path fill="${c}" transform="rotate(32 54 70)" d="${leaflet(40,6.4,70)}"/>
   <path fill="${c}" d="${leaflet(48,7.4,70)}"/>`},
 {name:'D · Leaf + ledger',desc:'Current three rules, with a leaf where the tick was.',
  fg:(c,t)=>`<rect x="28" y="52" width="36" height="6" rx="3" fill="${t}"/>
   <rect x="28" y="64" width="28" height="6" rx="3" fill="${t}"/>
   <rect x="28" y="76" width="18" height="6" rx="3" fill="${t}"/>
   <path fill="${c}" transform="rotate(35 72 44)" d="${leaflet(34,11,61,72)}"/>`},
];
const svg=(fg,bg,c,t,mono)=>`<svg viewBox="0 0 108 108" width="100%" height="100%"><rect width="108" height="108" fill="${bg}"/>${fg(c,mono?c:t).replace(/stroke="#145F58"/g,`stroke="${bg}"`)}</svg>`;
const g=document.getElementById('grid');
for(const k of concepts){
  const s=(bg=BG,c=CREAM,t=TINT,m=false)=>svg(k.fg,bg,c,t,m);
  g.insertAdjacentHTML('beforeend',`<div class="card">
   <div class="big">${s()}</div><h2>${k.name}</h2><p>${k.desc}</p>
   <div class="row"><div class="sq">${s()}</div><div class="ci">${s()}</div>
   <div class="mono">${s('#E3EEE9','#145F58','#145F58',true)}</div>
   <div class="dark"><div class="mono" style="width:44px;height:44px;border-radius:12px">${s('#244D46','#9ED8C4','#9ED8C4',true)}</div></div></div></div>`);
}
</script></body></html>

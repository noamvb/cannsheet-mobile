name: Publish historical signed APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to publish
        required: true
        type: string
      target_sha:
        description: Exact validated source commit for the release tag
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  RELEASE_REPOSITORY: noamvb/cannsheet-mobile-releases
  BUILD_TOOLS_VERSION: 36.0.0

jobs:
  confirm-target-validation:
    name: Confirm exact target validation
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      TARGET_SHA: ${{ inputs.target_sha }}

    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify tag and exact source commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release_tag must be a semantic version tag such as v1.4.5."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: target_sha must be a 40-character lowercase commit SHA."
            exit 1
          fi

          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          TAGGED_SHA=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")

          echo "Requested target SHA: $TARGET_SHA"
          echo "Checked-out SHA:      $CHECKED_OUT_SHA"
          echo "Tag target SHA:       $TAGGED_SHA"

          test "$CHECKED_OUT_SHA" = "$TARGET_SHA"
          test "$TAGGED_SHA" = "$TARGET_SHA"

      - name: Verify exact target passed main validation
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Searching for push-to-main validation run for commit $TARGET_SHA ==="

          RUNS_JSON=$(gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/android-pr-checks.yml/runs" \
            -f event=push \
            -f branch=main \
            -f per_page=100)

          MATCHING_RUN=$(echo "$RUNS_JSON" | jq -c --arg sha "$TARGET_SHA" '
            .workflow_runs
            | map(select(.head_sha == $sha and .event == "push" and .head_branch == "main"))
            | sort_by(.created_at)
            | last
          ')

          if [ -z "$MATCHING_RUN" ] || [ "$MATCHING_RUN" = "null" ]; then
            echo "ERROR: No push-to-main validation run found for $TARGET_SHA."
            exit 1
          fi

          RUN_ID=$(echo "$MATCHING_RUN" | jq -r '.id')
          RUN_STATUS=$(echo "$MATCHING_RUN" | jq -r '.status')
          RUN_CONCLUSION=$(echo "$MATCHING_RUN" | jq -r '.conclusion')
          RUN_URL=$(echo "$MATCHING_RUN" | jq -r '.html_url')

          echo "Found matching run ID $RUN_ID (status: $RUN_STATUS, conclusion: $RUN_CONCLUSION)"

          if [ "$RUN_STATUS" != "completed" ]; then
            echo "Matching validation run is still in progress; watching run $RUN_ID."
            gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status || true
            RUN_DATA=$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
            RUN_STATUS=$(echo "$RUN_DATA" | jq -r '.status')
            RUN_CONCLUSION=$(echo "$RUN_DATA" | jq -r '.conclusion')
          fi

          if [ "$RUN_STATUS" != "completed" ] || [ "$RUN_CONCLUSION" != "success" ]; then
            echo "ERROR: Main validation run $RUN_ID did not complete successfully (status: $RUN_STATUS, conclusion: $RUN_CONCLUSION)."
            exit 1
          fi

          echo "=== Verifying required job-level proof for run $RUN_ID ==="
          JOBS_JSON=$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest")

          EXPECTED_JOBS=(
            "Classify changes and scan repository"
            "Backend validation"
            "Android static validation"
            "Emulator API 24"
            "Emulator API 36"
            "Cannsheet Android PR validation"
          )

          for job_name in "${EXPECTED_JOBS[@]}"; do
            MATCHING_JOB=$(echo "$JOBS_JSON" | jq -c --arg name "$job_name" '.jobs | map(select(.name == $name))')
            JOB_COUNT=$(echo "$MATCHING_JOB" | jq 'length')

            if [ "$JOB_COUNT" -ne 1 ]; then
              echo "ERROR: Expected exactly one job named '$job_name', found $JOB_COUNT."
              exit 1
            fi

            JOB_STATUS=$(echo "$MATCHING_JOB" | jq -r '.[0].status')
            JOB_CONCLUSION=$(echo "$MATCHING_JOB" | jq -r '.[0].conclusion')
            echo "Job '$job_name': status=$JOB_STATUS, conclusion=$JOB_CONCLUSION"

            if [ "$JOB_STATUS" != "completed" ] || [ "$JOB_CONCLUSION" != "success" ]; then
              echo "ERROR: Required job '$job_name' did not pass cleanly."
              exit 1
            fi
          done

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### Exact-SHA Validation Proof Verified
          - **Release tag**: \`$RELEASE_TAG\`
          - **Target SHA**: \`$TARGET_SHA\`
          - **Matching run ID**: [$RUN_ID]($RUN_URL)
          - **Event**: \`push\`
          - **Branch**: \`main\`
          - **Overall conclusion**: \`$RUN_CONCLUSION\`
          - **Required job results**: all six \`success\`
          EOF

  verify:
    name: Verify and build historical signed APK
    needs: confirm-target-validation
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      TARGET_SHA: ${{ inputs.target_sha }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      version_code: ${{ steps.metadata.outputs.version_code }}

    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify target tag and version metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          TAGGED_SHA=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          test "$CHECKED_OUT_SHA" = "$TARGET_SHA"
          test "$TAGGED_SHA" = "$TARGET_SHA"

          app_version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          app_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          tag_version="${RELEASE_TAG#v}"

          test -n "$app_version"
          test -n "$app_code"
          echo "App versionName: $app_version"
          echo "App versionCode: $app_code"
          echo "Tag version: $tag_version"

          if [ "$app_version" != "$tag_version" ]; then
            echo "ERROR: App version $app_version does not match tag version $tag_version."
            exit 1
          fi

          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "version_code=$app_code" >> "$GITHUB_OUTPUT"

      - name: Validate release secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASES_TOKEN"
          echo "All release secrets are present."

      - name: Require monotonic versionCode
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$RELEASES_TOKEN"
          echo "=== Checking version monotonicity against published releases ==="

          LATEST_RELEASE_JSON=$(gh api --method GET "/repos/$RELEASE_REPOSITORY/releases" 2>/dev/null || echo "[]")

          if [ "$LATEST_RELEASE_JSON" = "[]" ] || [ -z "$LATEST_RELEASE_JSON" ]; then
            echo "No previous releases found. Initial release permitted."
          else
            LATEST_TAG=$(echo "$LATEST_RELEASE_JSON" | jq -r '.[0].tag_name // empty')
            if [ -n "$LATEST_TAG" ]; then
              echo "Found latest published release: $LATEST_TAG"
              mkdir -p "$RUNNER_TEMP/prev_release"
              if gh release download "$LATEST_TAG" --repo "$RELEASE_REPOSITORY" --pattern "*.apk" --dir "$RUNNER_TEMP/prev_release" 2>/dev/null; then
                PREV_APK=$(find "$RUNNER_TEMP/prev_release" -name '*.apk' -print -quit)
                if [ -n "$PREV_APK" ] && [ -f "$PREV_APK" ]; then
                  PREV_CODE=$("$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt" dump badging "$PREV_APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
                  echo "Previous published versionCode: $PREV_CODE"
                  echo "New build versionCode: ${{ steps.metadata.outputs.version_code }}"
                  if [ -n "$PREV_CODE" ]; then
                    if [ "${{ steps.metadata.outputs.version_code }}" -le "$PREV_CODE" ]; then
                      echo "ERROR: New versionCode must be greater than previous versionCode."
                      exit 1
                    fi
                    echo "Monotonic versionCode check passed."
                  else
                    echo "ERROR: Could not extract versionCode from previous APK $PREV_APK"
                    exit 1
                  fi
                else
                  echo "Warning: No APK asset found in previous release $LATEST_TAG."
                fi
              else
                echo "Warning: Could not download assets for previous release $LATEST_TAG."
              fi
            else
              echo "No existing releases found. Initial release permitted."
            fi
          fi

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/cannsheet-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/cannsheet-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$source_apk"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose --print-certs "$source_apk"

          BADGING=$("$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt" dump badging "$source_apk")
          PKG_NAME=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
          VER_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          VER_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")

          test "$PKG_NAME" = "com.noamv.cannsheet.mobile"
          test "$VER_CODE" = "${{ steps.metadata.outputs.version_code }}"
          test "$VER_NAME" = "${{ steps.metadata.outputs.version }}"
          echo "Signed APK verification succeeded."

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: historical-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified historical APK
    needs: [verify, confirm-target-validation]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: historical-signed-apk

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Prepare and independently verify publication APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          VERSION_CODE="${{ needs.verify.outputs.version_code }}"
          APK_NAME="Cannsheet-Mobile-${VERSION}.apk"
          SHA_NAME="${APK_NAME}.sha256"

          cp app-release.apk "$APK_NAME"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose --print-certs "$APK_NAME"

          BADGING=$("$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt" dump badging "$APK_NAME")
          PKG_NAME=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
          VER_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          VER_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")

          if [ "$PKG_NAME" != "com.noamv.cannsheet.mobile" ] || [ "$VER_CODE" != "$VERSION_CODE" ] || [ "$VER_NAME" != "$VERSION" ]; then
            echo "ERROR: Prepared APK metadata mismatch."
            exit 1
          fi

          sha256sum "$APK_NAME" > "$SHA_NAME"
          sha256sum -c "$SHA_NAME"
          echo "Prepared APK and checksum verified cleanly."

      - name: Reject existing public version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: Release $RELEASE_TAG already exists in $RELEASE_REPOSITORY."
            exit 1
          fi
          echo "Release tag does not exist. Proceeding with publication."

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          APK_NAME="Cannsheet-Mobile-${VERSION}.apk"
          SHA_NAME="${APK_NAME}.sha256"

          gh release create "$RELEASE_TAG" \
            "$APK_NAME" "$SHA_NAME" \
            --title "Cannsheet Mobile ${VERSION}" \
            --notes "Signed Cannsheet Mobile ${VERSION} APK." \
            --repo "$RELEASE_REPOSITORY"

      - name: Post-publication verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          VERSION_CODE="${{ needs.verify.outputs.version_code }}"
          APK_NAME="Cannsheet-Mobile-${VERSION}.apk"
          SHA_NAME="${APK_NAME}.sha256"

          PUB_JSON=$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json tagName,assets)
          test "$(echo "$PUB_JSON" | jq -r '.tagName')" = "$RELEASE_TAG"

          ASSET_NAMES=$(echo "$PUB_JSON" | jq -r '.assets[].name' | sort)
          EXPECTED_NAMES=$(printf "%s\n%s" "$APK_NAME" "$SHA_NAME" | sort)
          test "$ASSET_NAMES" = "$EXPECTED_NAMES"

          mkdir -p "$RUNNER_TEMP/pub_verify"
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --dir "$RUNNER_TEMP/pub_verify"

          cd "$RUNNER_TEMP/pub_verify"
          sha256sum -c "$SHA_NAME"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose --print-certs "$APK_NAME"

          BADGING=$("$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt" dump badging "$APK_NAME")
          PKG_NAME=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
          VER_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          VER_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")

          if [ "$PKG_NAME" != "com.noamv.cannsheet.mobile" ] || [ "$VER_CODE" != "$VERSION_CODE" ] || [ "$VER_NAME" != "$VERSION" ]; then
            echo "ERROR: Downloaded public APK metadata mismatch."
            exit 1
          fi

          echo "Historical release publication and post-publication verification succeeded."
